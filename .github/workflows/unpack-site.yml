name: Unpack uploaded site archive
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract archive and commit project files
        run: |
          unzip -o tos-vodniki-project-auth-fixed-2026-10-06.zip -d .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/unpack-site.yml
          git commit -m "Распаковать ZIP-сборку сайта"
          git push origin HEAD:main
