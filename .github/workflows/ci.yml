name: CI checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

jobs:
  tests:
    name: API and site tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Run automated tests
        run: npm test

      - name: Check JavaScript syntax
        run: node --check public/admin.js

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP API files
        run: find api -type f -name '*.php' -print0 | xargs -0 -n1 php -l
