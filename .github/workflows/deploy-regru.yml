name: Deploy static site to REG.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare complete static site
        shell: bash
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp -R site-source/. deploy/
          cp public/admin.js deploy/admin.js
          cp public/admin.css deploy/admin.css
          cp public/neighborhood.svg deploy/neighborhood.svg
          cp public/robots.txt deploy/robots.txt
          cp public/sitemap.xml deploy/sitemap.xml
          cp public/404.html deploy/404.html

      - name: Upload site to REG.ru
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.REG_FTP_SERVER }}
          username: ${{ secrets.REG_FTP_USERNAME }}
          password: ${{ secrets.REGRU_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./deploy/
          server-dir: /www/tos-vodniki.ru/
          dangerous-clean-slate: false
